# Alembic configuration for Detective-1 backend
#
# NOTE: sqlalchemy.url is intentionally left EMPTY here.
# The real database URL is injected at runtime by alembic/env.py, which reads
# it from the application settings (app.core.config.settings.SQLALCHEMY_DATABASE_URI
# / DATABASE_URL). Keeping it empty is a fail-safe: if env.py ever fails to
# override it, Alembic raises a clear error instead of silently connecting to a
# bogus placeholder database. Do NOT put a real or placeholder DSN here.

[alembic]
# Path to migration scripts, relative to this file (backend/alembic.ini).
script_location = alembic

# Prepend the backend root to sys.path so that "app.core.config" is importable
# from within alembic/env.py.
prepend_sys_path = .

# Use OS-specific path separator when splitting version_locations.
version_path_separator = os

# Template used to generate migration file names. Timestamp prefix keeps
# revisions chronologically sortable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Timezone for the timestamps in file_template (UTC keeps it deterministic
# across developer machines / CI).
timezone = UTC

# Left blank ON PURPOSE — overridden at runtime by alembic/env.py via
# config.set_main_option("sqlalchemy.url", str(settings.SQLALCHEMY_DATABASE_URI))
# which pulls the value from app.core.config.settings.
# Do NOT hardcode a real or placeholder DSN here.
sqlalchemy.url =

# Run "black" on newly generated migration scripts so they pass the linter.
[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 88 REVISION_SCRIPT_FILENAME

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
```

این نسخه مشکل audit را برطرف می‌کند:

**تغییرات کلیدی:**
- `sqlalchemy.url` خالی است (نه placeholder `driver://user:pass@localhost/dbname`) — fail-safe در صورت عدم override توسط `env.py`.
- `prepend_sys_path = .` تضمین می‌کند `app.core.config` از داخل `env.py` قابل import است.
- `file_template` با timestamp برای مرتب‌سازی زمانی revisionها.
- `post_write_hooks` با `black -l 88` تا migrationها linter را pass کنند.
- بخش‌های logging کامل شدند (در مرجع truncated بود: `keys = gener`).

**هشدار وابستگی cross-tier (مهم):**
این فایل به یک `alembic/env.py` متکی است که باید این کار را انجام دهد:
```python
from app.core.config import settings
config.set_main_option("sqlalchemy.url", str(settings.SQLALCHEMY_DATABASE_URI))