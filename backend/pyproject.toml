[tool.poetry]
name = "detective-1"
version = "0.1.0"
description = "Detective-1: OSINT intelligence encyclopedia and target profiling platform"
authors = ["Detective-1 Team"]
readme = "README.md"
license = "Proprietary"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
sqlalchemy = "^2.0.29"
alembic = "^1.13.1"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pgvector = "^0.2.5"
neo4j = "^5.18.0"
qdrant-client = "^1.8.0"
celery = { extras = ["redis"], version = "^5.3.6" }
redis = "^5.0.3"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
python-multipart = "^0.0.9"
httpx = "^0.27.0"
openai = "^1.16.0"
minio = "^7.2.5"
tenacity = "^8.2.3"
email-validator = "^2.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
pytest-cov = "^5.0.0"
mypy = "^1.9.0"
ruff = "^0.3.5"
types-passlib = "^1.7.7.20240311"
types-python-jose = "^3.3.4.20240106"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]
ignore = [
    "B008", # function call in default arg (FastAPI Depends pattern)
    "N805", # first arg of method (pydantic validators)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802"]
"app/models/*" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"